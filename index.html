<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hùng Akira - Nạp Kim Cương</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f5f7;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #fff;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        /* Header Banner */
        .header-banner {
            background: linear-gradient(135deg, #d32f2f, #b71c1c);
            color: white;
            border-radius: 15px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-banner img.avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #fff;
        }
        .header-info h2 {
            margin: 0;
            font-size: 18px;
        }
        .header-info p {
            margin: 4px 0 0;
            font-size: 11px;
            opacity: 0.9;
        }
        /* Số dư Kim Cương */
        .diamond-balance {
            background: #fff3e0;
            border: 1px solid #ffe0b2;
            padding: 10px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            color: #e65100;
        }
        /* Các khối form */
        .section-box {
            margin-top: 20px;
            background: #fafafa;
            border: 1px solid #eee;
            padding: 15px;
            border-radius: 15px;
        }
        .section-box h3 {
            font-size: 15px;
            margin-top: 0;
            color: #333;
        }
        .package-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .package-item {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            background: #fff;
            transition: 0.2s;
        }
        .package-item.active {
            border-color: #d32f2f;
            background: #fff5f5;
        }
        .package-item .dia {
            color: #0288d1;
            font-weight: bold;
        }
        .package-item .price {
            font-size: 13px;
            color: #555;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .btn-submit {
            background: #ff2d2d;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        /* Thông báo trạng thái */
        .alert {
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 13px;
            display: none;
        }
        .alert.error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }
        .alert.success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }
        /* Lịch sử */
        table {
            width: 100%;
            margin-top: 10px;
            border-collapse: collapse;
            font-size: 12px;
            text-align: center;
        }
        table th, table td {
            border: 1px solid #ddd;
            padding: 6px;
        }
        table th {
            background: #f1f1f1;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header kèm ảnh mặt của bạn -->
    <div class="header-banner">
        <img src="data:image/png;base64,..." alt="Avatar Hùng Akira" class="avatar" id="userAvatar">
        <div class="header-info">
            <h2>HÙNG AKIRA</h2>
            <p>Hệ Thống Nạp Kim Cương Free Fire Uy Tín & Tự Động 24/7</p>
        </div>
    </div>

    <!-- Hiển thị số lượng Kim Cương hiện có -->
    <div class="diamond-balance">
        💎 Số dư kim cương: <span id="userDiamonds">0</span> 💎
    </div>

    <!-- Chọn gói kim cương -->
    <div class="section-box">
        <h3>2 Chọn gói kim cương</h3>
        <div class="package-grid">
            <div class="package-item active" onclick="selectPackage(this, 2830, '50.000đ')">
                <div class="dia">2.830 💎</div>
                <div class="price">50.000đ</div>
            </div>
            <div class="package-item" onclick="selectPackage(this, 5660, '100.000đ')">
                <div class="dia">5.660 💎</div>
                <div class="price">100.000đ</div>
            </div>
            <div class="package-item" onclick="selectPackage(this, 11320, '200.000đ')">
                <div class="dia">11.320 💎</div>
                <div class="price">200.000đ</div>
            </div>
            <div class="package-item" onclick="selectPackage(this, 28300, '500.000đ')">
                <div class="dia">28.300 💎</div>
                <div class="price">500.000đ</div>
            </div>
        </div>
    </div>

    <!-- Phương thức thanh toán & Nạp thẻ -->
    <div class="section-box">
        <h3>3 Phương thức thanh toán</h3>
        <input type="text" id="cardCode" placeholder="Mã số thẻ (13 hoặc 15 số)">
        <input type="text" id="cardSerial" placeholder="Số serie thẻ (11 hoặc 14 số)">
        
        <button class="btn-submit" onclick="submitCard()">XÁC NHẬN NẠP THẺ</button>
        
        <!-- Khung báo lỗi / thành công -->
        <div id="alertBox" class="alert"></div>
    </div>

    <!-- Lịch sử nạp thẻ gần đây -->
    <div class="section-box">
        <h3>📜 Lịch sử nạp thẻ gần đây</h3>
        <table>
            <thead>
                <tr>
                    <th>Mệnh giá</th>
                    <th>Thời gian</th>
                    <th>Trạng thái</th>
                </tr>
            </thead>
            <tbody id="historyTable">
                <tr>
                    <td colspan="3">Chưa có giao dịch nào</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // Nhúng ảnh trực tiếp từ ảnh bạn vừa gửi vào thẻ img thông qua Data URL (hoặc bạn có thể thay đổi link ảnh tùy ý)
    // Lưu ý: Trong môi trường thực tế, bạn có thể thay đường dẫn src bằng tên file ảnh của bạn, ví dụ: src="avatar.jpg"
    
    let selectedDiamond = 2830;
    let selectedPriceText = '50.000đ';
    let currentDiamonds = 0;
    let isFirstHistory = true;

    // Chọn gói kim cương
    function selectPackage(element, diamondAmount, priceText) {
        document.querySelectorAll('.package-item').forEach(item => item.classList.remove('active'));
        element.classList.add('active');
        selectedDiamond = diamondAmount;
        selectedPriceText = priceText;
    }

    // Xử lý nạp thẻ
    function submitCard() {
        const code = document.getElementById('cardCode').value.trim();
        const serial = document.getElementById('cardSerial').value.trim();
        const alertBox = document.getElementById('alertBox');

        // Kiểm tra cơ bản độ dài mã thẻ / serial
        if(code.length < 10 || serial.length < 10) {
            alertBox.style.display = 'block';
            alertBox.className = 'alert error';
            alertBox.innerHTML = '❌ Vui lòng nhập đầy đủ mã thẻ và số seri hợp lệ!';
            return;
        }

        // --- XỬ LÝ NẠP THẺ THÀNH CÔNG ---
        alertBox.style.display = 'block';
        alertBox.className = 'alert success';
        alertBox.innerHTML = `✅ Nạp thẻ thành công gói ${selectedPriceText}! Đã cộng thêm +${selectedDiamond} 💎 vào tài khoản.`;

        // Cộng dồn kim cương
        currentDiamonds += selectedDiamond;
        document.getElementById('userDiamonds').textContent = currentDiamonds.toLocaleString();

        // Cập nhật bảng lịch sử nạp thẻ
        const historyTable = document.getElementById('historyTable');
        if(isFirstHistory) {
            historyTable.innerHTML = '';
            isFirstHistory = false;
        }

        const now = new Date();
        const timeString = now.toLocaleTimeString() + ' ' + now.toLocaleDateString();

        const newRow = `
            <tr>
                <td>${selectedPriceText}</td>
                <td>${timeString}</td>
                <td style="color: green; font-weight: bold;">Thành công (+${selectedDiamond} 💎)</td>
            </tr>
        `;
        historyTable.innerHTML = newRow + historyTable.innerHTML;

        // Xóa trống ô nhập sau khi nạp xong
        document.getElementById('cardCode').value = '';
        document.getElementById('cardSerial').value = '';
    }
</script>

</body>
</html>
